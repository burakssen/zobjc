name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  verify:
    name: Verify (${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Confirm host architecture (${{ matrix.arch }})
        run: |
          zig version
          uname -m

      - name: Build
        run: zig build

      - name: Run Unified Tests
        run: zig build test

      - name: Run basic_object example
        run: zig build run-basic_object

      - name: Run subclass example
        run: zig build run-subclass

      - name: Run block example
        run: zig build run-block

      - name: Run autorelease_pool example
        run: zig build run-autorelease_pool

      - name: Run runtime_introspection example
        run: zig build run-runtime_introspection

      - name: Run ownership_and_memory example
        run: zig build run-ownership_and_memory

      - name: Run type_encodings example
        run: zig build run-type_encodings

      - name: Run abi_classification example
        run: zig build run-abi_classification

      - name: Run messaging example
        run: zig build run-messaging
